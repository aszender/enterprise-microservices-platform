spring:
  datasource:
    url: ${PRODUCTS_DATASOURCE_URL:jdbc:postgresql://postgres:5432/products_db}
    username: ${PRODUCTS_DATASOURCE_USERNAME}
    password: ${PRODUCTS_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${PRODUCTS_SERVER_PORT:${SERVER_PORT:8080}}
