spring:
  application:
    name: orders-service
  profiles:
    default: local
  datasource:
    url: ${ORDERS_DATASOURCE_URL}
    username: ${ORDERS_DATASOURCE_USERNAME}
    password: ${ORDERS_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false

server:
  port: ${ORDERS_SERVER_PORT:${SERVER_PORT:8081}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

app:
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8082}
  grpc:
    inventory:
      host: ${INVENTORY_GRPC_HOST:localhost}
      port: ${INVENTORY_GRPC_PORT:9090}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-}]"
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
