spring:
  datasource:
    url: ${PRODUCTS_DATASOURCE_URL:jdbc:h2:mem:productsdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${PRODUCTS_DATASOURCE_USERNAME:products_local}
    password: ${PRODUCTS_DATASOURCE_PASSWORD:products_local}
  h2:
    console:
      enabled: ${PRODUCTS_H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktand0LXNlY3JldC0zMi1ieXRlcw==}
