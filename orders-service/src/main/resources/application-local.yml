spring:
  datasource:
    url: ${ORDERS_DATASOURCE_URL:jdbc:h2:mem:ordersdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${ORDERS_DATASOURCE_USERNAME:orders_local}
    password: ${ORDERS_DATASOURCE_PASSWORD:orders_local}
  h2:
    console:
      enabled: ${ORDERS_H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktand0LXNlY3JldC0zMi1ieXRlcw==}
