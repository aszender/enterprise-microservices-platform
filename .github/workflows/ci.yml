name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - "contracts/**"
      - "products-service/**"
      - "orders-service/**"
      - "inventory-service/**"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/ci.yml"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - "contracts/**"
      - "products-service/**"
      - "orders-service/**"
      - "inventory-service/**"

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify
        run: ./mvnw -B clean verify
