spring:
  application:
    name: inventory-service
  profiles:
    default: local
  datasource:
    url: ${INVENTORY_DATASOURCE_URL}
    username: ${INVENTORY_DATASOURCE_USERNAME}
    password: ${INVENTORY_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false

server:
  port: ${INVENTORY_SERVER_PORT:${SERVER_PORT:8082}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

app:
  grpc:
    server:
      port: ${INVENTORY_GRPC_SERVER_PORT:9090}
      enabled: ${INVENTORY_GRPC_SERVER_ENABLED:true}
  inventory:
    default-stock: ${INVENTORY_DEFAULT_STOCK:100}
    low-stock-threshold: ${INVENTORY_LOW_STOCK_THRESHOLD:5}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-}]"
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
