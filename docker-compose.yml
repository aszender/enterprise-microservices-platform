services:
  postgres:
    image: postgres:16
    container_name: postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: ${POSTGRES_USER:-local_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_app_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  products-service:
    build:
      context: ./products-service
    container_name: products-service
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=docker,kafka
      - SERVER_PORT=8080
      - PRODUCTS_DATASOURCE_URL=jdbc:postgresql://postgres:5432/app_db
      - PRODUCTS_DATASOURCE_USERNAME=${PRODUCTS_DATASOURCE_USERNAME:-local_app}
      - PRODUCTS_DATASOURCE_PASSWORD=${PRODUCTS_DATASOURCE_PASSWORD:-local_app_password}
      - JWT_SECRET=${JWT_SECRET:-bG9jYWwtZGV2LW9ubHktand0LXNlY3JldC0zMi1ieXRlcw==}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: products-service-nginx
    depends_on:
      - products-service
    ports:
      # Public entrypoint: Nginx on host
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft combined mode (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Required for single-node Kafka
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    image: redis:7-alpine
    container_name: redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus-local
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana-local
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    container_name: jaeger-local
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
