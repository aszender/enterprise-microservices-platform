spring:
  datasource:
    url: ${INVENTORY_DATASOURCE_URL:jdbc:h2:mem:inventorydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${INVENTORY_DATASOURCE_USERNAME:inventory_local}
    password: ${INVENTORY_DATASOURCE_PASSWORD:inventory_local}
  h2:
    console:
      enabled: ${INVENTORY_H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
